query Product($id: ID!) {
  shop {
    currencyCode
  }
  product(id: $id) {
    id
    handle
    status
    title
    description
    onlineStoreUrl
    productType
    vendor
    category {
      fullName
    }
    options {
      name
      values
    }
    images(first: 5) {
      nodes {
        url
      }
    }
    variants(first: 25) {
      pageInfo {
        hasNextPage
        endCursor
      }
      nodes {
        id
        title
        sku
        price
        selectedOptions {
          name
          value
        }
        image {
          url
        }
        inventoryQuantity
        inventoryPolicy
        inventoryItem {
          tracked
        }
      }
    }
  }
}
