[package]
name = "marketplace-service"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Pubky Marketplace Transaction Service (ADR-0019 / ADR-0022)"

[dependencies]
marketplace-domain.workspace = true
pubky-market-specs.workspace = true
anyhow.workspace = true
async-trait.workspace = true
axum.workspace = true
base64.workspace = true
base32.workspace = true
blake3.workspace = true
chacha20poly1305.workspace = true
chrono.workspace = true
ed25519-dalek.workspace = true
hex.workspace = true
hmac.workspace = true
pubky-common.workspace = true
rand.workspace = true
reqwest.workspace = true
serde.workspace = true
schemars.workspace = true
serde_json.workspace = true
serde_json_canonicalizer.workspace = true
sha2.workspace = true
sha3.workspace = true
subtle.workspace = true
sqlx.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["net"] }
tower-http.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
url.workspace = true
uuid.workspace = true
hkdf = "0.12"
pubky = { version = "=0.16.1", features = ["json"] }
# The HTTP client of requests to a homeserver a Pkarr record names
# (`homeserver_transport`): the reqwest major `pkarr` resolves and pins TLS
# for. The service's own HTTP client stays on reqwest 0.12.
pubky-reqwest = { package = "reqwest", version = "0.13", default-features = false }
# The TLS configuration of ICANN-domain homeservers in `homeserver_transport`
# (the roots and provider the `pubky` SDK uses for them).
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std"] }
webpki-roots = "1"
# RFC 9180 HPKE (DHKEM(X25519, HKDF-SHA256), HKDF-SHA256, ChaCha20-Poly1305),
# the suite the Shop seals delivery envelopes with. The connector worker opens
# the opt-in connector address envelope with it; the same crate pubky-core's
# homeserver uses.
hpke = { version = "0.14.1", default-features = false, features = ["alloc", "chacha", "x25519", "getrandom"] }

[features]
# Test-only fault hooks (e.g. the ambiguous bind-COMMIT injection in
# `payment_methods::test_faults`). Enabled only for integration tests via
# the self dev-dependency below; compiled out otherwise.
test-faults = []

[dev-dependencies]
http-body-util.workspace = true
tokio = { workspace = true, features = ["test-util"] }
tower.workspace = true
marketplace-service = { path = ".", features = ["test-faults"] }
apollo-compiler = "1.33.0"
# Real local DHT, HTTP relay and homeservers for the grant exchange
# (tests/grant_exchange_test.rs). Its homeservers keep their state in
# Postgres databases they create on the `DATABASE_URL` server.
pubky-testnet = { version = "=0.16.2", default-features = false }
# A key-pinned TLS homeserver that answers with a redirect.
tokio-rustls = { version = "0.26", default-features = false }
